name: Android CI

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK debug y ejecutar pruebas unitarias
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest --continue 2>&1 | tee build.log

      - name: Resumen de errores
        if: failure()
        shell: bash
        run: |
          echo "===== ERRORES DE COMPILACION ====="
          grep -E "^e: |\[ksp\]|What went wrong|FAILED|error:" build.log | sed 's#file:///home/runner/work/Fundaciontextil/Fundaciontextil/##' | sort -u | head -150

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: textil-circular-debug-apk
          path: app/build/outputs/apk/debug/*.apk
